name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Install window manager for native clipboard tests
        run: sudo apt-get update && sudo apt-get install -y openbox xdotool
      - name: Integration tests with a focused X11 window
        run: xvfb-run -a sh -c 'openbox >/tmp/openbox.log 2>&1 & bun run test:integration'
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: context-kit-vsix
          path: '*.vsix'

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: .vscode-test/**/logs/**
          include-hidden-files: true
